name: Recovery Build(TWRP)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL (if want to use SSH keys, use git@github.com:XXXXX)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'Manifest branch (choose one of the available branches)'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-12.1
          - twrp-14.1
          - twrp-14
          - twrp-11
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/snowwolf725/device_oneplus_waffle-TWRP'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/oneplus/waffle'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'waffle'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_waffle'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'
      ANDROID_TARGET:
        description: 'Android version this build targets'
        required: true
        default: 'Android 14'
        
#      PATCH_INSTALLET:
#        description: 'Patch recovery installer'
#        required: true
#        type: choice
#        default: 'true'
#        options:
#          - 'true'
#          - 'false'

#      BACKUP_METADATA:
#        description: 'allow backup metadata'
#        required: true
#        type: choice
#        default: 'true'
#        options:
#          - 'true'
#          - 'false'
jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    env:
      TIMESTAMP: 20250725
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "Android Target: ${{ github.event.inputs.ANDROID_TARGET }}"
        echo "::endgroup::"

    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v4

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      # That's it! Now use your normal steps

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') || 
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "Nico170420"
        git config --global user.email "b170420nc@gmail.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd
      
    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Check Build Tree
      uses: haya14busa/action-cond@v1
      id: buildtree
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
        if_true: twrp
        if_false: omni

    - name: Sync Device Dependencies
      run: |
        bash ${GITHUB_WORKSPACE}/scripts/convert.sh ${{ github.event.inputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies
        repo sync -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: | 
        cd bootable/recovery
        git apply --whitespace=nowarn ${GITHUB_WORKSPACE}/patch/001-ota-install-mod.patch
        cd ../../
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && make clean && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        TIMESTAMP=$(date +"%Y%m%d")
        echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
        cp out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img ../TWRP-${{ github.event.inputs.DEVICE_NAME }}-$TIMESTAMP.img
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building flashable zip
      run: |
        IMG_NAME="TWRP-${{ github.event.inputs.DEVICE_NAME }}-${TIMESTAMP}.img"
        ZIP_NAME="TWRP-${{ github.event.inputs.DEVICE_NAME }}-${TIMESTAMP}-flashable.zip"

        mkdir -p flashable_zip/META-INF/com/google/android
        cp "${IMG_NAME}" flashable_zip/recovery.img

        cat > flashable_zip/META-INF/com/google/android/update-binary << 'EOF'
        #!/sbin/sh
        # ****************************************************************
        # Flashable zip installer for TWRP recovery.img (RMX2020/RMX2027)
        # Checks: device match, partition existence, size fit, and a
        # flash_image -> dd fallback, mirroring what stock OFOX zips do.
        # ****************************************************************

        OUTFD="/proc/self/fd/$2"
        ZIPFILE="$3"

        ui_print() {
          until [ ! "$1" ]; do
            echo -e "ui_print $1\nui_print" >> "$OUTFD"
            shift
          done
        }

        abort() {
          ui_print "$*"
          exit 1
        }

        TARGET_DEVICE="${{ github.event.inputs.DEVICE_NAME }}"
        TARGET_DEVICE_ALT="RMX2027"

        GETPROP=$(which getprop 2>/dev/null)
        [ -z "$GETPROP" ] && GETPROP=/system/bin/getprop
        [ ! -e "$GETPROP" ] && GETPROP=/sbin/getprop

        PRODUCT_DEVICE=$($GETPROP "ro.product.device")

        case "$PRODUCT_DEVICE" in
          "$TARGET_DEVICE"|"$TARGET_DEVICE_ALT") ;;
          *) abort "E3004: This package is for $TARGET_DEVICE/$TARGET_DEVICE_ALT. This device ($PRODUCT_DEVICE) is not supported." ;;
        esac

        ui_print "- Installing recovery for $PRODUCT_DEVICE ..."

        TMP_DIR=/tmp/recovery_flash_$$
        mkdir -p "$TMP_DIR"

        ui_print "- Extracting recovery.img from zip..."
        unzip -o "$ZIPFILE" recovery.img -d "$TMP_DIR" || abort "E3005: Failed to extract recovery.img from the zip."

        [ -f "$TMP_DIR/recovery.img" ] || abort "E3006: recovery.img not found after extraction."

        RECOVERY_PARTITION=$(find /dev/block/bootdevice/by-name -iname "recovery" 2>/dev/null | head -n1)
        [ -z "$RECOVERY_PARTITION" ] && RECOVERY_PARTITION=$(find /dev/block/by-name -iname "recovery" 2>/dev/null | head -n1)
        [ -z "$RECOVERY_PARTITION" ] && abort "E3007: Could not locate the recovery partition on this device."

        ui_print "- Found recovery partition: $RECOVERY_PARTITION"

        PART_SIZE=$(blockdev --getsize64 "$RECOVERY_PARTITION" 2>/dev/null)
        IMG_SIZE=$(wc -c < "$TMP_DIR/recovery.img")

        if [ -n "$PART_SIZE" ] && [ "$IMG_SIZE" -gt "$PART_SIZE" ]; then
          rm -rf "$TMP_DIR"
          abort "E3008: recovery.img ($IMG_SIZE bytes) is bigger than the recovery partition ($PART_SIZE bytes)."
        fi

        FLASH_IMAGE=$(which flash_image 2>/dev/null)
        [ -z "$FLASH_IMAGE" ] && [ -e /sbin/flash_image ] && FLASH_IMAGE=/sbin/flash_image
        ERASE_IMAGE=$(which erase_image 2>/dev/null)
        [ -z "$ERASE_IMAGE" ] && [ -e /sbin/erase_image ] && ERASE_IMAGE=/sbin/erase_image

        FLASH_OK=0

        if [ -x "$FLASH_IMAGE" ]; then
          ui_print "- Flashing via flash_image..."
          [ -x "$ERASE_IMAGE" ] && "$ERASE_IMAGE" "$RECOVERY_PARTITION" >/dev/null 2>&1
          "$FLASH_IMAGE" "$RECOVERY_PARTITION" "$TMP_DIR/recovery.img" && FLASH_OK=1
        fi

        if [ "$FLASH_OK" != "1" ]; then
          ui_print "- Flashing via dd..."
          dd if="$TMP_DIR/recovery.img" of="$RECOVERY_PARTITION" bs=4096 && FLASH_OK=1
        fi

        rm -rf "$TMP_DIR"

        if [ "$FLASH_OK" != "1" ]; then
          abort "E3009: Flashing failed. Your recovery partition may need to be restored manually via fastboot."
        fi

        ui_print "- Recovery flashed successfully."
        ui_print "- Reboot to recovery to use it."
        exit 0
        EOF
        chmod 755 flashable_zip/META-INF/com/google/android/update-binary

        echo "#MAGISK" > flashable_zip/META-INF/com/google/android/updater-script

        cd flashable_zip
        zip -r9 "../${ZIP_NAME}" .
        cd ..

        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
        echo "IMG_NAME=${IMG_NAME}" >> $GITHUB_ENV
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to gofile
      id: gofile
      run: |
        SERVER=$(curl -s https://api.gofile.io/servers | grep -o '"name":"[^"]*"' | head -n1 | cut -d'"' -f4)
        echo "Using gofile server: $SERVER"

        upload_and_get_link() {
          FILE_PATH=$1
          RESPONSE=$(curl -s -F "file=@${FILE_PATH}" "https://${SERVER}.gofile.io/uploadFile")
          echo "$RESPONSE" | grep -o '"downloadPage":"[^"]*"' | cut -d'"' -f4 | sed 's/\\\//\//g'
        }

        IMG_LINK=$(upload_and_get_link "${{ steps.pwd.outputs.workspace-folder }}/${IMG_NAME}")
        ZIP_LINK=$(upload_and_get_link "${{ steps.pwd.outputs.workspace-folder }}/${ZIP_NAME}")

        echo "IMG_LINK=${IMG_LINK}" >> $GITHUB_ENV
        echo "ZIP_LINK=${ZIP_LINK}" >> $GITHUB_ENV
        echo "### Gofile Links" >> $GITHUB_STEP_SUMMARY
        echo "- IMG: ${IMG_LINK}" >> $GITHUB_STEP_SUMMARY
        echo "- Flashable ZIP: ${ZIP_LINK}" >> $GITHUB_STEP_SUMMARY
